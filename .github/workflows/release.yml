name: release
# Runs only when a version tag is pushed. It tests, builds the image, scans it, writes an SBOM and
# publishes to GHCR. It never deploys anything.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov
      - run: uv run pip-audit

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mcp-hub:scan
      - name: Scan image (fail on unaddressed high/critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mcp-hub:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (non-root, refuses unauthenticated public bind)
        run: |
          test "$(docker run --rm --entrypoint id mcp-hub:scan -u)" = "10001"
          ! docker run --rm mcp-hub:scan 2>&1 | grep -q "Uvicorn running"
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: mcp-hub:scan
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
