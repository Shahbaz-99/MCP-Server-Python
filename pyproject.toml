[project]
name = "mcp-hub"
version = "0.1.0"
description = "Production-grade, plugin-based MCP server (stdio + Streamable HTTP)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10.1",
    "prometheus-client>=0.21",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "sqlglot>=25",
    "uvicorn>=0.31.1",
    "tzdata>=2024.1",
]

[project.scripts]
mcp-hub = "mcp_hub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hub"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pip-audit>=2.7",
    "cryptography>=43",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "T20", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S104", "S311", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["mcp_hub"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
